<!-- 在 <style> 中加入天氣動畫效果 -->
<style>
    .weather-badge { background: rgba(20, 184, 166, 0.1); border: 1px solid rgba(20, 184, 166, 0.2); }
    .animate-pulse-slow { animation: pulse 3s cubic-bezier(0.4, 0, 0.6, 1) infinite; }
</style>

<!-- 修改 Itinerary (Page 1) 的 Header 部分 -->
<div v-if="currentTab === 'itinerary'">
    <header class="p-6 pt-12 bg-white">
        <div class="flex justify-between items-start mb-4">
            <input v-model="tripName" class="text-2xl font-light tracking-widest text-teal-800 bg-transparent outline-none border-b border-teal-100 w-2/3">
            
            <!-- 天氣 Widget -->
            <div v-if="weather" class="weather-badge p-2 rounded-2xl flex flex-col items-end">
                <div class="flex items-center gap-1 text-teal-600 font-bold">
                    <span>{{ Math.round(weather.temp) }}°C</span>
                    <i v-if="weather.rain > 20" data-lucide="cloud-rain" class="w-3 h-3 text-blue-400"></i>
                    <i v-else data-lucide="sun" class="w-3 h-3 text-orange-400"></i>
                </div>
                <p class="text-[8px] text-teal-500 opacity-80">降雨: {{ weather.rain }}% | UV: {{ weather.uv }}</p>
            </div>
        </div>

        <div class="flex gap-4 overflow-x-auto no-scrollbar py-2">
            <!-- ... 原有的日期捲軸代碼 ... -->
            <div v-for="n in 7" :key="n" @click="selectedDay = n"
                 :class="selectedDay === n ? 'day-card-active shadow-lg' : 'bg-teal-50 text-teal-600'"
                 class="flex-shrink-0 w-16 h-20 rounded-2xl flex flex-col items-center justify-center transition-all duration-300 cursor-pointer">
                <span class="text-[10px] opacity-70">DAY</span>
                <span class="text-xl font-bold">{{ n }}</span>
            </div>
        </div>
        
        <!-- 當天詳細天氣提醒 -->
        <div v-if="weather" class="mt-4 flex gap-4 text-[10px] text-slate-400 px-2">
            <span class="flex items-center gap-1"><i data-lucide="thermometer" class="w-3 h-3"></i> 體感 {{ Math.round(weather.feels_like) }}°C</span>
            <span :class="weather.uv > 5 ? 'text-orange-500 font-bold' : ''" class="flex items-center gap-1">
                <i data-lucide="zap" class="w-3 h-3"></i> 紫外線: {{ weather.uv }} {{ weather.uv > 5 ? '(需防曬)' : '' }}
            </span>
        </div>
    </header>
    <!-- ... 其餘 Itinerary 內容 ... -->
</div>

<script>
    const { createApp, ref, onMounted, computed, nextTick } = Vue;

    createApp({
        setup() {
            // ... 原有的變數 ...
            const weather = ref(null);
            // 請替換成你自己的 API Key
            const apiKey = '993501b28825da20bbdcb3f15efd5879'; 
            const city = 'Okinawa';

            const fetchWeather = async () => {
                try {
                    // 1. 先抓取天氣與降雨機率 (5-day forecast 可取得機率)
                    const res = await fetch(`https://api.openweathermap.org/data/2.5/forecast?q=${city}&units=metric&appid=${apiKey}&lang=zh_tw`);
                    const data = await res.json();
                    
                    // 2. 抓取紫外線指數 (One Call API 或 Current UV)
                    // 這裡簡化處理，抓取當前天氣
                    const currentRes = await fetch(`https://api.openweathermap.org/data/2.5/weather?q=${city}&units=metric&appid=${apiKey}`);
                    const currentData = await currentRes.json();

                    weather.value = {
                        temp: currentData.main.temp,
                        feels_like: currentData.main.feels_like,
                        rain: data.list[0].pop * 100, // 降雨機率 (0-1 轉為 %)
                        uv: 6.5, // 注意：OpenWeather 免費版 UV API 有時限制較多，此處設為模擬值或需串接 OneCall
                        desc: currentData.weather[0].description
                    };
                    
                    nextTick(() => lucide.createIcons());
                } catch (e) {
                    console.error("天氣抓取失敗", e);
                }
            };

            onMounted(() => {
                lucide.createIcons();
                fetchWeather(); // 初始抓取天氣
            });

            // ... 其餘邏輯 (保持不變) ...
            return {
                // ...
                weather,
                fetchWeather
            };
        }
    }).mount('#app');
</script>
