<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Okinawa Travel Master - Fix Version</title>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Noto Sans JP', sans-serif; background: #f8fafc; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .glass-effect { background: rgba(255, 255, 255, 0.98); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); }
        
        /* 修正點擊狀態：確保顏色對比明顯 */
        .day-card-active { 
            background-color: #0d9488 !important; 
            color: white !important; 
            transform: scale(1.05); 
            box-shadow: 0 10px 15px -3px rgba(13, 148, 136, 0.4); 
            z-index: 10;
        }
        .day-card-inactive {
            background-color: #f1f5f9;
            color: #64748b;
        }
        
        .animate-fade { animation: fadeIn 0.4s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        
        /* 解決 iOS 點擊延遲與穿透問題 */
        .clickable { cursor: pointer; touch-action: manipulation; }
    </style>
</head>
<body class="text-slate-800">
    <div id="app" class="max-w-md mx-auto min-h-screen relative pb-32" @touchstart="handleGlobalTouch">

        <div v-if="currentTab === 'itinerary'" class="animate-fade">
            <header class="p-6 pt-12 bg-white sticky top-0 z-50 shadow-sm">
                <div class="flex justify-between items-start mb-6">
                    <div class="flex-1 mr-4">
                        <input v-model="tripName" placeholder="點擊命名旅程" class="text-2xl font-bold text-teal-900 bg-transparent outline-none w-full border-b border-teal-50">
                        <div class="flex items-center gap-1 mt-3">
                            <input type="date" v-model="startDate" class="text-[11px] bg-slate-50 p-1.5 rounded text-teal-700 outline-none border border-slate-100">
                            <span class="text-[10px] text-slate-400">至</span>
                            <input type="date" v-model="endDate" class="text-[11px] bg-slate-50 p-1.5 rounded text-teal-700 outline-none border border-slate-100">
                        </div>
                    </div>
                    <div class="bg-teal-50 p-2.5 px-3.5 rounded-2xl flex flex-col items-center min-w-[80px] border border-teal-100 shadow-sm">
                        <div v-if="loadingWeather" class="text-[8px] animate-pulse">更新中...</div>
                        <template v-else-if="dayWeather">
                            <div class="flex items-center gap-1 font-bold text-teal-700">
                                <i v-if="dayWeather.rain > 30" data-lucide="cloud-rain" class="w-3.5 h-3.5 text-blue-500"></i>
                                <i v-else data-lucide="sun" class="w-3.5 h-3.5 text-orange-500"></i>
                                <span class="text-xs">{{ Math.round(dayWeather.temp) }}°C</span>
                            </div>
                            <span class="text-[9px] text-teal-500 font-medium">降雨 {{ Math.round(dayWeather.rain) }}%</span>
                        </template>
                    </div>
                </div>

                <div class="flex gap-3 overflow-x-auto no-scrollbar py-2 relative">
                    <div v-for="n in totalDays" :key="n" 
                         :data-day="n"
                         @click="setDay(n)"
                         class="day-btn flex-shrink-0 w-14 h-16 rounded-2xl flex flex-col items-center justify-center transition-all clickable"
                         :class="Number(selectedDay) === n ? 'day-card-active' : 'day-card-inactive'">
                        <span class="text-[9px] font-bold uppercase pointer-events-none">Day</span>
                        <span class="text-lg font-bold pointer-events-none">{{ n }}</span>
                    </div>
                </div>
            </header>

            <main class="p-6">
                <div class="flex justify-between items-center mb-6">
                    <h2 class="text-xs font-bold text-slate-400 uppercase tracking-widest">{{ currentDayLabel }} 行程表</h2>
                    <button @click="addPlan" class="bg-teal-600 text-white p-2.5 rounded-full shadow-lg active:scale-90 transition-transform">
                        <i data-lucide="plus" class="w-5 h-5"></i>
                    </button>
                </div>

                <div class="space-y-4">
                    <div v-for="(item, index) in filteredItineraries" :key="index" class="bg-white p-5 rounded-[2rem] shadow-sm border border-slate-50 flex items-start gap-4 animate-fade">
                        <input type="time" v-model="item.time" class="text-sm font-bold text-teal-600 pt-1 outline-none bg-transparent">
                        <div class="flex-1">
                            <input v-model="item.location" placeholder="要去哪裡？" class="w-full text-base font-bold outline-none mb-1 text-slate-700">
                            <div class="flex gap-4 mt-1">
                                <button @click="openMap(item.location)" class="text-[10px] text-slate-400 flex items-center gap-1.5 hover:text-teal-500">
                                    <i data-lucide="map-pin" class="w-3 h-3"></i>導航
                                </button>
                                <button @click="removePlan(item)" class="text-[10px] text-red-300 flex items-center gap-1.5 hover:text-red-500">
                                    <i data-lucide="trash-2" class="w-3 h-3"></i>刪除
                                </button>
                            </div>
                        </div>
                    </div>
                    
                    <div v-if="filteredItineraries.length === 0" class="flex flex-col items-center justify-center py-12 text-slate-300">
                        <i data-lucide="calendar-days" class="w-12 h-12 mb-2 opacity-20"></i>
                        <p class="text-xs italic">Day {{ selectedDay }} 尚無行程</p>
                    </div>
                </div>
            </main>
        </div>

        <nav class="fixed bottom-8 left-8 right-8 glass-effect rounded-[2.5rem] border border-white/50 shadow-2xl flex justify-around items-center p-2 z-[100]">
            <button @click="setTab('itinerary')" :class="currentTab === 'itinerary' ? 'text-teal-600' : 'text-slate-300'" class="flex flex-col items-center p-4">
                <i data-lucide="map" class="w-6 h-6"></i>
                <span class="text-[10px] mt-1.5 font-black uppercase">行程</span>
            </button>
            </nav>
    </div>

    <script>
        const { createApp, ref, onMounted, computed, nextTick, watch } = Vue;
        createApp({
            setup() {
                const currentTab = ref('itinerary');
                const selectedDay = ref(1);
                const startDate = ref('2026-05-12');
                const endDate = ref('2026-05-16');
                const itineraries = ref([]);
                // ... 其他數據變量 ...

                const totalDays = computed(() => {
                    if (!startDate.value || !endDate.value) return 1;
                    const start = new Date(startDate.value);
                    const end = new Date(endDate.value);
                    return Math.ceil((end - start) / (1000 * 60 * 60 * 24)) + 1;
                });

                const setDay = (n) => {
                    selectedDay.value = Number(n);
                    nextTick(() => lucide.createIcons());
                };

                const filteredItineraries = computed(() => {
                    const activeDay = Number(selectedDay.value);
                    return itineraries.value.filter(item => Number(item.day) === activeDay);
                });

                // 【關鍵】暴力抓取點擊
                const handleGlobalTouch = (e) => {
                    const btn = e.target.closest('.day-btn');
                    if (btn) {
                        const day = btn.getAttribute('data-day');
                        if (day) setDay(Number(day));
                    }
                };

                onMounted(() => {
                    lucide.createIcons();
                });

                return {
                    currentTab, selectedDay, startDate, endDate, totalDays, setDay,
                    filteredItineraries, handleGlobalTouch, itineraries, // 以及其他方法...
                };
            }
        }).mount('#app');
    </script>
</body>
</html>
