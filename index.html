<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>沖繩之旅 🌴</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            'okinawa-pink': '#FF69B4', // 較深的粉色
            'okinawa-light-pink': '#FFF0F5',
            'okinawa-dark-pink': '#C71585', // 用於文字
          }
        }
      }
    }
  </script>
</head>
<body class="bg-okinawa-light-pink font-sans">

  <div id="app" class="flex flex-col h-screen">

    <!-- 標題區域 -->
    <div class="bg-okinawa-pink text-white text-center py-4 px-6 rounded-b-2xl shadow-md">
      <h1 class="text-3xl font-bold inline-block bg-white text-okinawa-pink px-6 py-2 rounded-full">沖繩之旅 🌴</h1>
      <div class="mt-4 bg-white text-okinawa-pink text-sm px-6 py-2 rounded-full inline-block">
        <span class="mr-2">出發日期：2024-05-20</span>
        <span class="mr-2">回程日期：2024-05-25</span>
        <span class="font-bold">（6天旅程）</span>
      </div>
    </div>

    <!-- 分頁導覽 -->
    <div class="flex-grow overflow-y-auto">
      <div v-if="activeTab === 'itinerary'" class="p-6">
        <!-- 日期選擇 (橫向滑動) -->
        <div class="flex overflow-x-auto py-2 mb-4 space-x-2">
          <button v-for="(day, index) in itineraryData" :key="index"
                  class="bg-white text-okinawa-pink px-4 py-2 rounded-full whitespace-nowrap shadow hover:bg-okinawa-light-pink"
                  @click="selectedDayIndex = index">
            第 {{ index + 1 }} 天 ({{ day.date }})
          </button>
        </div>

        <!-- 行程卡片 -->
        <div v-for="(item, index) in currentDayItinerary" :key="index" class="bg-white p-4 rounded-xl shadow mb-4">
          <div class="flex items-center justify-between">
            <div class="flex items-center">
              <span class="text-okinawa-pink text-xl font-bold mr-2">{{ item.time }}</span>
              <span class="text-gray-800 text-lg font-medium">{{ item.location }}</span>
            </div>
            <div class="text-sm text-gray-500 flex items-center">
              <span>{{ item.weather.temp }}°C</span>
              <img :src="item.weather.icon" alt="天氣圖標" class="w-6 h-6 ml-1">
            </div>
          </div>
          <!-- 備註功能 -->
          <div class="mt-2 text-sm text-gray-600">
            <p v-if="!item.noteEditing">{{ item.note || '尚無備註' }}</p>
            <textarea v-else v-model="item.note" class="w-full border border-gray-300 rounded p-1" rows="2"></textarea>
            <div class="flex justify-end mt-1">
                <button v-if="!item.noteEditing" @click="item.noteEditing = true" class="text-okinawa-pink text-xs">編輯</button>
                <div v-else class="space-x-2">
                    <button @click="saveNote(item)" class="text-okinawa-pink text-xs">保存</button>
                    <button @click="item.noteEditing = false; item.note = item.originalNote" class="text-gray-500 text-xs">取消</button>
                </div>
            </div>
          </div>
        </div>

      </div>
      <div v-if="activeTab === 'billing'" class="p-6"> 記賬內容 (待完善) </div>
      <div v-if="activeTab === 'wishes'" class="p-6"> 心願內容 (待完善) </div>
    </div>

    <!-- 地圖區域 -->
    <div id="map" class="h-64 mt-6"></div>

    <!-- 底部導覽欄 -->
    <div class="bg-white border-t border-gray-200 py-3 px-6 rounded-t-2xl shadow-lg mt-auto">
      <div class="flex justify-around items-center">
        <button v-for="tab in tabs" :key="tab.id" 
                class="text-okinawa-pink focus:outline-none"
                @click="activeTab = tab.id">
          <span class="text-2xl" :class="{ 'font-bold': activeTab === tab.id }">{{ tab.icon }}</span>
          <span class="text-sm block" :class="{ 'font-bold': activeTab === tab.id }">{{ tab.name }}</span>
        </button>
      </div>
    </div>

  </div>

</body>
</html>
