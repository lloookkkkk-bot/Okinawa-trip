<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Okinawa Travel Master</title>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Noto Sans JP', sans-serif; background: #f8fafc; margin: 0; padding: 0; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .glass-effect { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px); }
        .day-card-active { background: #0d9488; color: white; transform: scale(1.05); box-shadow: 0 4px 12px rgba(13, 148, 136, 0.2); }
        .animate-fade { animation: fadeIn 0.3s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body class="text-slate-800">
    <div id="app" class="max-w-md mx-auto min-h-screen relative pb-32">

        <!-- ================= 分頁 1: 行程 ================= -->
        <div v-if="currentTab === 'itinerary'" class="animate-fade">
            <header class="p-6 pt-12 bg-white sticky top-0 z-40 shadow-sm">
                <div class="flex justify-between items-start mb-4">
                    <div class="flex-1 mr-4">
                        <input v-model="tripName" placeholder="點擊命名旅程" class="text-2xl font-bold text-teal-900 bg-transparent outline-none w-full border-b border-teal-50">
                        <div class="flex items-center gap-1 mt-2">
                            <input type="date" v-model="startDate" class="text-[10px] bg-slate-50 p-1 rounded text-teal-700 outline-none">
                            <span class="text-[10px] text-slate-400">至</span>
                            <input type="date" v-model="endDate" class="text-[10px] bg-slate-50 p-1 rounded text-teal-700 outline-none">
                        </div>
                    </div>
                    <div class="bg-teal-50 p-2 px-3 rounded-2xl flex flex-col items-center min-w-[70px] border border-teal-100">
                        <div v-if="loadingWeather" class="text-[8px] animate-pulse">連線中...</div>
                        <template v-else-if="dayWeather">
                            <div class="flex items-center gap-1 font-bold text-teal-700">
                                <i v-if="dayWeather.rain > 30" data-lucide="cloud-rain" class="w-3 h-3 text-blue-500"></i>
                                <i v-else data-lucide="sun" class="w-3 h-3 text-orange-500"></i>
                                <span class="text-xs">{{ Math.round(dayWeather.temp) }}°C</span>
                            </div>
                            <span class="text-[8px] text-teal-500 font-medium">降雨 {{ Math.round(dayWeather.rain) }}%</span>
                        </template>
                    </div>
                </div>
                <div class="flex gap-3 overflow-x-auto no-scrollbar py-2">
                    <div v-for="n in totalDays" :key="n" 
     @click="setDay(n)" 
     :class="selectedDay === n ? 'day-card-active' : 'bg-slate-50 text-slate-400'"
     class="flex-shrink-0 w-14 h-16 rounded-2xl flex flex-col items-center justify-center transition-all cursor-pointer">
    <span class="text-[9px] font-bold uppercase">Day</span>
    <span class="text-lg font-bold">{{ n }}</span>
</div>

                </div>
            </header>
            <main class="p-6">
                <div class="flex justify-between items-center mb-6">
                    <h2 class="text-xs font-bold text-slate-400 uppercase tracking-widest">{{ currentDayLabel }} 行程表</h2>
                    <button @click="addPlan" class="bg-teal-600 text-white p-2 rounded-full shadow-lg active:scale-90"><i data-lucide="plus" class="w-4 h-4"></i></button>
                </div>
                <div class="space-y-4">
                    <div v-for="(item, index) in filteredItineraries" :key="index" class="bg-white p-4 rounded-3xl shadow-sm border border-slate-50 flex items-start gap-4 animate-fade">
                        <input type="time" v-model="item.time" class="text-sm font-bold text-teal-600 pt-1 outline-none bg-transparent">
                        <div class="flex-1">
                            <input v-model="item.location" placeholder="輸入地點..." class="w-full text-base font-bold outline-none mb-1">
                            <div class="flex gap-4">
                                <button @click="openMap(item.location)" class="text-[10px] text-slate-400 flex items-center gap-1"><i data-lucide="map-pin" class="w-3 h-3"></i>導航</button>
                                <button @click="removePlan(index)" class="text-[10px] text-red-200 flex items-center gap-1"><i data-lucide="trash" class="w-3 h-3"></i>刪除</button>
                            </div>
                        </div>
                    </div>
                </div>
            </main>
        </div>

        <!-- ================= 分頁 2: 記帳 ================= -->
        <div v-if="currentTab === 'finance'" class="p-6 pt-12 animate-fade">
            <h2 class="text-2xl font-bold text-teal-900 mb-6">開支統計</h2>
            <div class="bg-teal-600 rounded-[2.5rem] p-6 text-white shadow-xl mb-6">
                <p class="text-xs opacity-80 mb-1">總預算 (HKD)</p>
                <h3 class="text-3xl font-black font-mono mb-4">$ {{ totalExpensesHKD }}</h3>
                <div class="grid grid-cols-3 gap-2 pt-4 border-t border-white/20 text-[10px] text-center">
                    <div><p class="opacity-70">🛍️ 購物</p><p class="font-bold">${{ getCatTotal('購物') }}</p></div>
                    <div><p class="opacity-70">🍴 食物</p><p class="font-bold">${{ getCatTotal('食物') }}</p></div>
                    <div><p class="opacity-70">✨ 其他</p><p class="font-bold">${{ getCatTotal('其他') }}</p></div>
                </div>
            </div>
            <button @click="addExpense" class="w-full py-4 bg-white border-2 border-dashed border-teal-100 rounded-2xl text-teal-600 text-xs font-bold mb-6">+ 新增支出</button>
            <div class="space-y-3">
                <div v-for="(exp, index) in expenses" :key="index" class="bg-white p-4 rounded-2xl shadow-sm border border-slate-50">
                    <div class="flex items-center gap-2 mb-3">
                        <select v-model="exp.category" class="text-[10px] bg-teal-50 text-teal-600 p-1 px-2 rounded-lg font-bold outline-none">
                            <option>購物</option><option>食物</option><option>其他</option>
                        </select>
                        <input v-model="exp.name" placeholder="項目名稱..." class="flex-1 text-sm font-bold outline-none">
                        <button @click="expenses.splice(index, 1)" class="text-slate-200"><i data-lucide="x" class="w-4 h-4"></i></button>
                    </div>
                    <div class="flex items-center justify-between bg-slate-50 p-2 rounded-xl">
                        <div class="font-mono text-xs text-slate-400">JPY <input type="number" v-model.number="exp.amount" class="bg-transparent font-bold text-teal-700 w-24 outline-none"></div>
                        <span class="text-[10px] text-slate-400">≈ HKD {{ (exp.amount * exchangeRate).toFixed(1) }}</span>
                    </div>
                </div>
            </div>
        </div>
                <div v-if="currentTab === 'wishlist'" class="p-6 pt-12 animate-fade">
            <h2 class="text-2xl font-bold text-teal-900 mb-6">心願清單</h2>

            <div class="flex p-1 bg-slate-100 rounded-2xl mb-6">
                <button @click="wishTab = 'spots'" 
                        :class="wishTab === 'spots' ? 'bg-white text-teal-600 shadow-sm' : 'text-slate-400'"
                        class="flex-1 py-2 text-xs font-bold rounded-xl transition-all">
                    想去地點
                </button>
                <button @click="wishTab = 'items'" 
                        :class="wishTab === 'items' ? 'bg-white text-teal-600 shadow-sm' : 'text-slate-400'"
                        class="flex-1 py-2 text-xs font-bold rounded-xl transition-all">
                    想要東西
                </button>
            </div>

            <div class="space-y-3">
                <div v-for="(item, idx) in (wishTab === 'spots' ? spots : wishlistItems)" :key="idx" 
                     class="bg-white p-4 rounded-2xl flex items-center gap-3 shadow-sm border border-slate-50 animate-fade">
                    
                    <input v-if="wishTab === 'items'" type="checkbox" v-model="item.done" class="w-4 h-4 rounded border-slate-300 text-teal-600 focus:ring-teal-500">
                    
                    <input v-model="item.name" 
                           :class="item.done ? 'line-through text-slate-300' : 'text-slate-700'"
                           class="flex-1 text-sm font-medium outline-none bg-transparent" 
                           placeholder="輸入內容...">

                    <button v-if="wishTab === 'spots'" @click="openMap(item.name)" class="text-teal-500 p-1">
                        <i data-lucide="navigation" class="w-4 h-4"></i>
                    </button>
                    
                    <button @click="(wishTab === 'spots' ? spots : wishlistItems).splice(idx,1)" class="text-slate-200 hover:text-red-400">
                        <i data-lucide="x" class="w-4 h-4"></i>
                    </button>
                </div>

                <button @click="addWishItem" class="w-full py-4 border-2 border-dashed border-slate-100 text-slate-300 rounded-2xl text-[10px] font-bold hover:bg-slate-50 transition-colors">
                    + 增加新項目
                </button>

                <div v-if="(wishTab === 'spots' ? spots : wishlistItems).length === 0" class="text-center py-10 text-slate-200 italic text-xs">
                    這裡還是空的
                </div>
            </div>
        </div>


          <!-- 底部導覽 -->
        <nav class="fixed bottom-6 left-6 right-6 glass-effect rounded-[2.5rem] border border-white/50 shadow-2xl flex justify-around items-center p-2 z-50">
            
            <!-- 1. 行程按鈕 -->
            <button @click="setTab('itinerary')" :class="currentTab === 'itinerary' ? 'text-teal-600' : 'text-slate-300'" class="flex flex-col items-center p-3">
                <i data-lucide="calendar" class="w-6 h-6"></i>
                <span class="text-[9px] mt-1 font-bold">行程</span>
            </button>

            <!-- 2. 記帳按鈕 -->
            <button @click="setTab('finance')" :class="currentTab === 'finance' ? 'text-teal-600' : 'text-slate-300'" class="flex flex-col items-center p-3">
                <i data-lucide="banknote" class="w-6 h-6"></i>
                <span class="text-[9px] mt-1 font-bold">記帳</span>
            </button>

            <!-- 3. 心願按鈕 (請把原本那個 opacity-30 的替換成這段) 🚀 -->
            <button @click="setTab('wishlist')" :class="currentTab === 'wishlist' ? 'text-teal-600' : 'text-slate-300'" class="flex flex-col items-center p-3">
                <i data-lucide="stars" class="w-6 h-6"></i>
                <span class="text-[9px] mt-1 font-bold">心願</span>
            </button>

        </nav>
    </div>

    <script>
        const { createApp, ref, onMounted, computed, nextTick, watch } = Vue;
        createApp({
            setup() {
                const currentTab = ref('itinerary');
                const selectedDay = ref(1);
                const tripName = ref('');
                const startDate = ref('2026-05-12');
                const endDate = ref('2026-05-16');
                const exchangeRate = ref(0.052);
                
                const itineraries = ref([]);
                const expenses = ref([]);
                const weatherForecast = ref([]);
                const loadingWeather = ref(true);

                const totalDays = computed(() => {
                    const start = new Date(startDate.value);
                    const end = new Date(endDate.value);
                    return Math.max(1, Math.ceil((end - start) / (1000 * 60 * 60 * 24)) + 1);
                });

                watch(totalDays, (newVal) => { if (selectedDay.value > newVal) selectedDay.value = 1; });

                const currentDayLabel = computed(() => {
                    const d = new Date(startDate.value);
                    d.setDate(d.getDate() + (selectedDay.value - 1));
                    return d.toLocaleDateString('zh-TW', { month: 'short', day: 'numeric' });
                });
                const setDay = (n) => {
    selectedDay.value = n;
    nextTick(() => {
        if (window.lucide) lucide.createIcons();
    });
};

                const filteredItineraries = computed(() => itineraries.value.filter(i => i.day === selectedDay.value).sort((a,b) => a.time.localeCompare(b.time)));

                const totalExpensesHKD = computed(() => (expenses.value.reduce((s, e) => s + (Number(e.amount) || 0), 0) * exchangeRate.value).toFixed(1));
                const getCatTotal = (c) => (expenses.value.filter(e => e.category === c).reduce((s, e) => s + (Number(e.amount) || 0), 0) * exchangeRate.value).toFixed(0);

                const dayWeather = computed(() => {
                    if (!weatherForecast.value.length) return null;
                    const d = new Date(startDate.value);
                    d.setDate(d.getDate() + (selectedDay.value - 1));
                    const targetStr = d.toISOString().split('T')[0];
                    return weatherForecast.value.find(w => w.dt_txt.includes(targetStr)) || weatherForecast.value[0];
                });
                const wishTab = ref('spots'); // 預設顯示想去地點
                const spots = ref([]);        // 想去地點數據
                const wishlistItems = ref([]); // 想要東西數據

                const addWishItem = () => {
                    if (wishTab.value === 'spots') {
                        spots.value.push({ name: '' });
                    } else {
                        wishlistItems.value.push({ name: '', done: false });
                    }
                    nextTick(() => lucide.createIcons());
                };

                const setTab = (t) => { currentTab.value = t; nextTick(() => lucide.createIcons()); };
                const addPlan = () => { itineraries.value.push({ day: selectedDay.value, time: '12:00', location: '' }); nextTick(() => lucide.createIcons()); };
                const removePlan = (idx) => { itineraries.value.splice(itineraries.value.indexOf(filteredItineraries.value[idx]), 1); };
                const addExpense = () => { expenses.value.unshift({ category: '食物', name: '', amount: null }); nextTick(() => lucide.createIcons()); };
                const openMap = (loc) => loc && window.open(`https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(loc + ' 沖繩')}`, '_blank');

                onMounted(() => {
                    fetch(`https://api.openweathermap.org/data/2.5/forecast?q=Okinawa&units=metric&appid=78781fcf8811b4ce945f224a81386c53`)
                        .then(res => res.json()).then(data => {
                            weatherForecast.value = data.list.map(i => ({ temp: i.main.temp, rain: i.pop * 100, dt_txt: i.dt_txt }));
                            loadingWeather.value = false;
                            nextTick(() => lucide.createIcons());
                        });
                    lucide.createIcons();
                });

                return {
                    currentTab, selectedDay, tripName, startDate, endDate, totalDays, selectedDay, setDay, currentDayLabel,
                    itineraries, filteredItineraries, expenses, totalExpensesHKD, getCatTotal,
                    loadingWeather, dayWeather, setTab, addPlan, removePlan, addExpense, openMap, exchangeRate, wishTab, spots, wishlistItems, addWishItem
                };
            }
        }).mount('#app');
    </script>
</body>
</html>
