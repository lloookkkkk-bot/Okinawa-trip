<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>沖繩之旅 🌴</title>
    <style>
        :root {
            --primary-pink: #FFC1CC;
            --soft-pink: #FFE4E8;
            --accent-pink: #FF8DA1;
            --white: #FFFFFF;
            --text-color: #5A5A5A;
        }

        body {
            font-family: 'Helvetica Neue', Helvetica, Arial, "Microsoft JhengHei", sans-serif;
            background-color: var(--soft-pink);
            color: var(--text-color);
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        /* 標題樣式 - 膠囊型底色 */
        header {
            margin-top: 30px;
            margin-bottom: 20px;
        }

        .title-capsule {
            background-color: var(--primary-pink);
            color: var(--white);
            padding: 10px 30px;
            border-radius: 50px; /* 膠囊型狀 */
            font-size: 24px;
            font-weight: bold;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
            display: inline-block;
        }

        /* 分頁容器 (Deck Container) */
        .container {
            width: 90%;
            max-width: 500px;
            background: var(--white);
            border-radius: 25px;
            padding: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
            flex-grow: 1;
            margin-bottom: 80px; /* 為底部導航留空間 */
        }

        .tab-content {
            display: none;
            animation: fadeIn 0.3s ease-in-out;
        }

        .tab-content.active {
            display: block;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* 底部導航欄 */
        .bottom-nav {
            position: fixed;
            bottom: 20px;
            width: 90%;
            max-width: 500px;
            background-color: var(--white);
            border-radius: 50px;
            display: flex;
            justify-content: space-around;
            padding: 10px 0;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
        }

        .nav-item {
            flex: 1;
            text-align: center;
            padding: 10px 0;
            cursor: pointer;
            transition: all 0.3s;
            border-radius: 50px;
            margin: 0 5px;
            font-weight: bold;
            color: var(--accent-pink);
        }

        .nav-item.active {
            background-color: var(--primary-pink);
            color: var(--white);
        }

        h2 {
            text-align: center;
            color: var(--accent-pink);
            font-size: 20px;
            border-bottom: 2px dashed var(--soft-pink);
            padding-bottom: 10px;
        }

        .placeholder-text {
            text-align: center;
            color: #AAA;
            margin-top: 50px;
            font-style: italic;
        }
    </style>
</head>
<body>

    <header>
        <div class="title-capsule">沖繩之旅 🌴</div>
    </header>

    <div class="container">
        <!-- 行程分頁 -->
        <div id="tab1" class="tab-content active">
            <h2>📍 旅行行程</h2>
            <div class="placeholder-text">點擊下方選單切換分頁...</div>
        </div>

        <!-- 記賬分頁 -->
        <div id="tab2" class="tab-content">
            <h2>💰 開支記賬</h2>
            <div class="placeholder-text">準備好開始記錄花費了嗎？</div>
        </div>

        <!-- 心願分頁 -->
        <div id="tab3" class="tab-content">
            <h2>✨ 購物心願</h2>
            <div class="placeholder-text">把想買的都寫下來吧！</div>
        </div>
    </div>

    <!-- 底部切換選單 -->
    <nav class="bottom-nav">
        <div class="nav-item active" onclick="switchTab(1, this)">行程</div>
        <div class="nav-item" onclick="switchTab(2, this)">記賬</div>
        <div class="nav-item" onclick="switchTab(3, this)">心願</div>
    </nav>

    <script>
        function switchTab(tabIndex, element) {
            // 隱藏所有分頁內容
            const contents = document.querySelectorAll('.tab-content');
            contents.forEach(content => content.classList.remove('active'));

            // 移除所有導航項目的 active 狀態
            const navItems = document.querySelectorAll('.nav-item');
            navItems.forEach(item => item.classList.remove('active'));

            // 顯示當前選中的分頁
            document.getElementById('tab' + tabIndex).classList.add('active');
            
            // 激活當前導航按鈕
            element.classList.add('active');
        }
    </script>

</body>
</html>
