<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Okinawa Zen Travel</title>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Noto Sans JP', sans-serif; background-color: #f7fafc; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .glass-effect { background: rgba(255, 255, 255, 0.85); backdrop-filter: blur(12px); }
        .tab-active { color: #14b8a6; transform: translateY(-4px); }
        .day-card-active { background-color: #14b8a6; color: white; transform: scale(1.05); }
        .weather-badge { background: rgba(20, 184, 166, 0.08); border: 1px solid rgba(20, 184, 166, 0.15); min-width: 100px; }
        .animate-fade-in { animation: fadeIn 0.5s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body class="text-slate-700">
    <div id="app" class="max-w-md mx-auto min-h-screen relative pb-32">
        
        <!-- ================= PAGE 1: 行程 (Itinerary) ================= -->
        <div v-if="currentTab === 'itinerary'">
            <header class="p-6 pt-12 bg-white">
                <div class="mb-6">
                    <input v-model="tripName" class="text-2xl font-light tracking-widest text-teal-800 bg-transparent outline-none border-b border-teal-100 w-full mb-4">
                    
                    <div class="flex items-center justify-between gap-4">
                        <!-- 日期設定 -->
                        <div class="flex items-center gap-2 text-[10px] text-slate-400 font-medium">
                            <div class="flex flex-col">
                                <label class="text-teal-600 mb-1 text-[8px] uppercase tracking-tighter">Departure</label>
                                <input type="date" v-model="startDate" class="bg-teal-50 text-teal-800 p-1 rounded-md outline-none border-none">
                            </div>
                            <div class="pt-3">→</div>
                            <div class="flex flex-col">
                                <label class="text-teal-600 mb-1 text-[8px] uppercase tracking-tighter">Return</label>
                                <input type="date" v-model="endDate" class="bg-teal-50 text-teal-800 p-1 rounded-md outline-none border-none">
                            </div>
                        </div>

                        <!-- 天氣 Widget -->
                        <div class="weather-badge p-2 px-3 rounded-2xl flex flex-col items-end animate-fade-in">
                            <div v-if="loadingWeather" class="text-[8px] text-teal-400 animate-pulse">Loading...</div>
                            <template v-else-if="weather">
                                <div class="flex items-center gap-1 text-teal-600 font-bold">
                                    <span class="text-sm">{{ Math.round(weather.temp) }}°C</span>
                                    <i v-if="weather.rain > 30" data-lucide="cloud-rain" class="w-3 h-3 text-blue-400"></i>
                                    <i v-else data-lucide="sun" class="w-3 h-3 text-orange-400"></i>
                                </div>
                                <p class="text-[8px] text-teal-500 font-medium whitespace-nowrap">降雨 {{ Math.round(weather.rain) }}% | UV {{ weather.uv }}</p>
                            </template>
                        </div>
                    </div>
                </div>

                <!-- 動態日期選單 -->
                <div class="flex gap-4 overflow-x-auto no-scrollbar py-2">
                    <div v-for="n in totalDays" :key="n" @click="selectedDay = n"
                         :class="selectedDay === n ? 'day-card-active shadow-lg' : 'bg-teal-50 text-teal-600'"
                         class="flex-shrink-0 w-16 h-20 rounded-2xl flex flex-col items-center justify-center transition-all duration-300 cursor-pointer">
                        <span class="text-[10px] opacity-70 font-bold uppercase">Day</span>
                        <span class="text-xl font-bold">{{ n }}</span>
                    </div>
                </div>
            </header>

            <main class="px-6 mt-4">
                <div class="flex justify-between items-center mb-6">
                    <h2 class="text-sm font-bold tracking-widest text-teal-900 uppercase flex items-center gap-2">
                        <span class="w-1.5 h-1.5 bg-teal-500 rounded-full"></span>
                        Day {{ selectedDay }} Plans
                    </h2>
                    <button @click="addPlan" class="text-teal-600 bg-teal-50 px-4 py-1.5 rounded-full text-xs font-medium active:scale-95">+ Add</button>
                </div>
                
                <div v-for="(item, index) in filteredItineraries" :key="index" class="mb-4 bg-white rounded-3xl p-5 shadow-sm border border-teal-50/50 animate-fade-in">
                    <div class="flex items-center gap-3">
                        <input type="time" v-model="item.time" class="text-xs font-mono text-teal-500 bg-transparent outline-none">
                        <input v-model="item.location" placeholder="行程地點" class="text-base font-medium outline-none flex-1">
                        <button @click="openSingleMap(item.location)" class="p-2 text-teal-400"><i data-lucide="navigation" class="w-4 h-4"></i></button>
                        <button @click="removePlan(index)" class="p-2 text-slate-200"><i data-lucide="x" class="w-4 h-4"></i></button>
                    </div>
                </div>
            </main>
        </div>

        <!-- ================= PAGE 2: 記帳系統 ================= -->
        <div v-if="currentTab === 'finance'" class="p-6 pt-12 animate-fade-in">
            <h2 class="text-2xl font-light tracking-widest text-teal-800 mb-6">財務管理</h2>
            <section class="bg-teal-600 rounded-[2.5rem] p-6 text-white shadow-xl mb-6">
                <p class="text-[10px] opacity-70 uppercase tracking-widest mb-1">Total Spending (HKD)</p>
                <h3 class="text-3xl font-bold font-mono mb-4">$ {{ totalExpensesHKD }}</h3>
                <div class="grid grid-cols-3 gap-2 border-t border-teal-400/40 pt-4 text-[9px] text-center">
                    <div><p class="opacity-70 mb-1">🛍️ 購物</p><p class="font-bold">${{ catTotal('購物') }}</p></div>
                    <div><p class="opacity-70 mb-1">🍴 食物</p><p class="font-bold">${{ catTotal('食物') }}</p></div>
                    <div><p class="opacity-70 mb-1">✨ 其他</p><p class="font-bold">${{ catTotal('其他支出') }}</p></div>
                </div>
            </section>

            <button @click="addExpense" class="w-full py-4 bg-white rounded-2xl shadow-sm border border-teal-50 text-teal-600 text-xs font-bold mb-6">+ 新增支出項目</button>

            <div class="space-y-3">
                <div v-for="(exp, index) in expenses" :key="index" class="bg-white p-4 rounded-2xl shadow-sm border border-slate-50">
                    <div class="flex items-center gap-2 mb-3">
                        <select v-model="exp.category" class="text-[10px] bg-teal-50 text-teal-600 px-2 py-1 rounded-lg outline-none font-bold">
                            <option value="購物">🛍️ 購物</option>
                            <option value="食物">🍴 食物</option>
                            <option value="其他支出">✨ 其他</option>
                        </select>
                        <input v-model="exp.name" placeholder="項目名稱" class="flex-1 text-sm font-medium outline-none">
                        <button @click="expenses.splice(index, 1)" class="text-slate-200"><i data-lucide="trash-2" class="w-4 h-4"></i></button>
                    </div>
                    <div class="flex items-center justify-between bg-slate-50 p-3 rounded-xl">
                        <div class="flex items-center gap-1 font-mono">
                            <span class="text-[10px] text-slate-400 uppercase">JPY</span>
                            <input type="number" v-model.number="exp.amount" class="bg-transparent font-bold text-teal-700 w-24 outline-none">
                        </div>
                        <span class="text-[10px] text-slate-400 font-mono">≈ HKD ${{ (exp.amount * exchangeRate).toFixed(1) }}</span>
                    </div>
                </div>
            </div>
        </div>

        <!-- ================= PAGE 3: Wishlist ================= -->
        <div v-if="currentTab === 'wishlist'" class="p-6 pt-12 animate-fade-in">
            <h2 class="text-2xl font-light tracking-widest text-teal-800 mb-6">心願清單</h2>
            <div class="mb-8">
                <p class="text-[10px] font-bold text-teal-800 uppercase tracking-widest mb-4 flex items-center gap-2">
                    <span class="w-1 h-4 bg-teal-500 rounded-full"></span> 想去的地點
                </p>
                <div v-for="(spot, index) in spots" :key="index" class="bg-white p-4 rounded-2xl mb-2 flex justify-between items-center border border-teal-50">
                    <input v-model="spot.name" class="text-sm outline-none flex-1 font-medium">
                    <button @click="openSingleMap(spot.name)" class="p-2 text-teal-500"><i data-lucide="navigation" class="w-4 h-4"></i></button>
                </div>
                <button @click="spots.push({name:''})" class="text-[10px] text-teal-400 font-bold mt-2 px-2">+ 增加地點</button>
            </div>
        </div>

        <!-- ================= DOCK NAVIGATION ================= -->
        <nav class="fixed bottom-8 left-6 right-6 glass-effect rounded-[2.5rem] border border-white/50 shadow-2xl flex justify-around items-center p-2 px-6 z-50">
            <button @click="setTab('itinerary')" :class="currentTab === 'itinerary' ? 'tab-active' : 'text-slate-300'" class="flex flex-col items-center p-2 transition-all">
                <i data-lucide="calendar-days" class="w-5 h-5"></i>
                <span class="text-[9px] mt-1 font-bold">行程</span>
            </button>
            <button @click="setTab('finance')" :class="currentTab === 'finance' ? 'tab-active' : 'text-slate-300'" class="flex flex-col items-center p-2 transition-all">
                <i data-lucide="wallet" class="w-5 h-5"></i>
                <span class="text-[9px] mt-1 font-bold">記帳</span>
            </button>
            <button @click="setTab('wishlist')" :class="currentTab === 'wishlist' ? 'tab-active' : 'text-slate-300'" class="flex flex-col items-center p-2 transition-all">
                <i data-lucide="heart" class="w-5 h-5"></i>
                <span class="text-[9px] mt-1 font-bold">願望</span>
            </button>
        </nav>
    </div>

    <script>
        const { createApp, ref, onMounted, computed, nextTick } = Vue;

        createApp({
            setup() {
                const currentTab = ref('itinerary');
                const tripName = ref('沖繩 · 琉璃色之夏');
                const selectedDay = ref(1);
                const exchangeRate = ref(0.052);
                
                // 日期相關
                const startDate = ref('2026-06-01');
                const endDate = ref('2026-06-05');

                const totalDays = computed(() => {
                    const start = new Date(startDate.value);
                    const end = new Date(endDate.value);
                    const diffTime = Math.abs(end - start);
                    const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24)) + 1; 
                    return diffDays > 0 ? diffDays : 1;
                });

                // 天氣相關
                const weather = ref(null);
                const loadingWeather = ref(true);
                const apiKey = '78781fcf8811b4ce945f224a81386c53';

                const fetchWeather = async () => {
                    loadingWeather.value = true;
                    try {
                        const currentRes = await fetch(`https://api.openweathermap.org/data/2.5/weather?q=Okinawa&units=metric&appid=${apiKey}&lang=zh_tw`);
                        if (!currentRes.ok) throw new Error();
                        const currentData = await currentRes.json();
                        
                        const forecastRes = await fetch(`https://api.openweathermap.org/data/2.5/forecast?q=Okinawa&units=metric&appid=${apiKey}`);
                        const forecastData = await forecastRes.json();

                        weather.value = {
                            temp: currentData.main.temp,
                            rain: (forecastData.list[0].pop * 100) || 0,
                            uv: 7.2
                        };
                    } catch (e) {
                        console.error("Weather API Error, using fallback.");
                        // 備用數據
                        weather.value = { temp: 28, rain: 15, uv: 7 };
                    } finally {
                        loadingWeather.value = false;
                        nextTick(() => lucide.createIcons());
                    }
                };

                const itineraries = ref([{ day: 1, time: '10:00', location: '那霸機場' }]);
                const expenses = ref([{ category: '食物', name: '拉麵', amount: 1200 }]);
                const spots = ref([{ name: '美麗海水族館' }]);
                const wishlist = ref([]);

                const filteredItineraries = computed(() => itineraries.value.filter(i => i.day === selectedDay.value));

                const totalExpensesHKD = computed(() => {
                    const totalJPY = expenses.value.reduce((sum, item) => sum + (item.amount || 0), 0);
                    return (totalJPY * exchangeRate.value).toFixed(1);
                });

                const catTotal = (cat) => {
                    const total = expenses.value.filter(e => e.category === cat).reduce((sum, item) => sum + (item.amount || 0), 0);
                    return (total * exchangeRate.value).toFixed(0);
                };

                const setTab = (tab) => {
                    currentTab.value = tab;
                    nextTick(() => lucide.createIcons());
                };

                const addPlan = () => {
                    itineraries.value.push({ day: selectedDay.value, time: '12:00', location: '' });
                    nextTick(() => lucide.createIcons());
                };

                const addExpense = () => {
                    expenses.value.unshift({ category: '食物', name: '', amount: 0 });
                    nextTick(() => lucide.createIcons());
                };

                const removePlan = (idx) => {
                    const realIndex = itineraries.value.indexOf(filteredItineraries.value[idx]);
                    itineraries.value.splice(realIndex, 1);
                };

                const openSingleMap = (loc) => {
                    window.open(`https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(loc + ' 沖繩')}`, '_blank');
                };

                onMounted(() => {
                    lucide.createIcons();
                    fetchWeather();
                });

                return {
                    currentTab, tripName, selectedDay, itineraries, filteredItineraries,
                    expenses, totalExpensesHKD, catTotal, spots, wishlist,
                    setTab, addPlan, addExpense, removePlan, openSingleMap, exchangeRate, 
                    weather, loadingWeather, startDate, endDate, totalDays
                };
            }
        }).mount('#app');
    </script>
</body>
</html>
