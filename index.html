<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Okinawa Travel Master</title>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Noto Sans JP', sans-serif; background-color: #f8fafc; -webkit-tap-highlight-color: transparent; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .glass-effect { background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px); }
        .tab-active { color: #0d9488; transform: translateY(-3px); font-weight: 800; }
        .day-card-active { background: #0d9488; color: white; transform: scale(1.05); box-shadow: 0 10px 15px -3px rgba(13, 148, 136, 0.3); }
        .animate-in { animation: slideUp 0.4s ease-out; }
        @keyframes slideUp { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }
        input[type="date"], input[type="time"] { appearance: none; -webkit-appearance: none; border: none; background: transparent; }
    </style>
</head>
<body class="text-slate-800">
    <div id="app" class="max-w-md mx-auto min-h-screen relative pb-36">

        <!-- ================= 1. 行程頁面 ================= -->
        <div v-if="currentTab === 'itinerary'" class="animate-in">
            <header class="p-6 pt-12 bg-white sticky top-0 z-40 shadow-sm">
                <div class="flex justify-between items-start mb-6">
                    <div>
                        <h1 class="text-2xl font-bold text-teal-900 mb-1">沖繩之旅 🏝️</h1>
                        <div class="flex items-center gap-2 text-xs text-slate-400">
                            <input type="date" v-model="startDate" class="text-teal-600 font-bold">
                            <span>至</span>
                            <input type="date" v-model="endDate" class="text-teal-600 font-bold">
                        </div>
                    </div>
                    
                    <!-- 天氣 Widget -->
                    <div class="bg-teal-50 border border-teal-100 p-2 px-3 rounded-2xl flex flex-col items-center">
                        <div v-if="loadingWeather" class="text-[10px] text-teal-400 animate-pulse">Loading...</div>
                        <template v-else-if="weather">
                            <div class="flex items-center gap-1">
                                <i v-if="weather.rain > 30" data-lucide="cloud-rain" class="w-4 h-4 text-blue-500"></i>
                                <i v-else data-lucide="sun" class="w-4 h-4 text-orange-500"></i>
                                <span class="text-sm font-bold text-teal-800">{{ Math.round(weather.temp) }}°C</span>
                            </div>
                            <span class="text-[8px] text-teal-500 font-medium">降雨 {{ Math.round(weather.rain) }}%</span>
                        </template>
                    </div>
                </div>

                <!-- 橫向滑動日期選單 -->
                <div class="flex gap-3 overflow-x-auto no-scrollbar py-2">
                    <div v-for="n in totalDays" :key="n" @click="selectedDay = n"
                         :class="selectedDay === n ? 'day-card-active' : 'bg-slate-100 text-slate-400'"
                         class="flex-shrink-0 w-14 h-16 rounded-2xl flex flex-col items-center justify-center transition-all cursor-pointer">
                        <span class="text-[9px] font-bold uppercase tracking-tighter">Day</span>
                        <span class="text-lg font-bold">{{ n }}</span>
                    </div>
                </div>
            </header>

            <!-- 行程清單 -->
            <main class="px-6 mt-6">
                <div class="flex justify-between items-center mb-4">
                    <h2 class="text-xs font-bold tracking-widest text-slate-400 uppercase">Schedule · Day {{ selectedDay }}</h2>
                    <button @click="addPlan" class="bg-teal-600 text-white p-2 rounded-full shadow-lg active:scale-90 transition-transform">
                        <i data-lucide="plus" class="w-4 h-4"></i>
                    </button>
                </div>
                
                <div class="space-y-4">
                    <div v-for="(item, index) in filteredItineraries" :key="index" class="bg-white rounded-3xl p-4 shadow-sm border border-slate-100 flex items-start gap-4">
                        <input type="time" v-model="item.time" class="text-sm font-bold text-teal-600 pt-1">
                        <div class="flex-1">
                            <input v-model="item.location" placeholder="輸入目的地..." class="w-full text-base font-bold outline-none mb-1">
                            <div class="flex gap-4">
                                <button @click="openSingleMap(item.location)" class="text-[10px] text-slate-400 flex items-center gap-1">
                                    <i data-lucide="map-pin" class="w-3 h-3"></i> 地圖
                                </button>
                                <button @click="removePlan(index)" class="text-[10px] text-red-300 flex items-center gap-1">
                                    <i data-lucide="trash-2" class="w-3 h-3"></i> 刪除
                                </button>
                            </div>
                        </div>
                    </div>
                    <div v-if="filteredItineraries.length === 0" class="text-center py-10 text-slate-300 text-sm italic">
                        今天還沒有安排行程...
                    </div>
                </div>
            </main>
        </div>

        <!-- ================= 2. 記帳頁面 ================= -->
        <div v-if="currentTab === 'finance'" class="p-6 pt-12 animate-in">
            <h2 class="text-2xl font-bold text-teal-900 mb-6">開支統計</h2>
            
            <div class="bg-gradient-to-br from-teal-600 to-teal-700 rounded-[2rem] p-6 text-white shadow-xl mb-8 relative overflow-hidden">
                <div class="relative z-10">
                    <p class="text-xs opacity-80 mb-1 font-medium">總計支出 (HKD)</p>
                    <h3 class="text-4xl font-black font-mono mb-6">$ {{ totalExpensesHKD }}</h3>
                    <div class="flex justify-between items-center bg-white/10 p-3 rounded-xl backdrop-blur-md">
                        <span class="text-[10px]">今日匯率參考：1 JPY ≈ {{ exchangeRate }} HKD</span>
                    </div>
                </div>
                <i data-lucide="wallet" class="absolute -bottom-4 -right-4 w-32 h-32 opacity-10"></i>
            </div>

            <button @click="addExpense" class="w-full py-4 bg-teal-50 border-2 border-dashed border-teal-200 rounded-2xl text-teal-600 text-xs font-bold mb-6 flex items-center justify-center gap-2">
                <i data-lucide="plus-circle" class="w-4 h-4"></i> 新增支出
            </button>

            <div class="space-y-3">
                <div v-for="(exp, index) in expenses" :key="index" class="bg-white p-4 rounded-2xl shadow-sm border border-slate-100 animate-in">
                    <div class="flex justify-between items-start mb-3">
                        <input v-model="exp.name" placeholder="項目名稱 (例如: 拉麵)" class="text-sm font-bold outline-none flex-1">
                        <button @click="expenses.splice(index, 1)" class="text-slate-300 hover:text-red-400 transition-colors"><i data-lucide="x" class="w-4 h-4"></i></button>
                    </div>
                    <div class="flex items-center justify-between">
                        <div class="bg-slate-50 flex items-center px-3 py-2 rounded-xl border border-slate-100">
                            <span class="text-[10px] text-slate-400 font-bold mr-2 uppercase">JPY</span>
                            <input type="number" v-model.number="exp.amount" class="bg-transparent font-mono font-bold text-teal-700 w-20 outline-none text-sm">
                        </div>
                        <div class="text-right">
                            <p class="text-[10px] text-slate-400 uppercase font-bold">≈ HKD</p>
                            <p class="font-mono font-bold text-teal-600">${{ (exp.amount * exchangeRate).toFixed(1) }}</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- ================= 3. 心願清單 ================= -->
        <div v-if="currentTab === 'wishlist'" class="p-6 pt-12 animate-in">
            <h2 class="text-2xl font-bold text-teal-900 mb-6">想去的景點</h2>
            <div class="space-y-3">
                <div v-for="(spot, index) in spots" :key="index" class="bg-white p-4 rounded-2xl flex items-center gap-3 shadow-sm border border-slate-100">
                    <div class="w-8 h-8 bg-teal-50 rounded-full flex items-center justify-center text-teal-500 font-bold text-xs">{{ index + 1 }}</div>
                    <input v-model="spot.name" class="flex-1 text-sm outline-none font-medium" placeholder="例如: 萬座毛">
                    <button @click="openSingleMap(spot.name)" class="p-2 text-teal-500"><i data-lucide="navigation" class="w-4 h-4"></i></button>
                    <button @click="spots.splice(index,1)" class="p-1 text-slate-200"><i data-lucide="minus-circle" class="w-4 h-4"></i></button>
                </div>
                <button @click="spots.push({name:''})" class="w-full py-4 border-2 border-dashed border-slate-200 rounded-2xl text-slate-400 text-xs font-bold">+ 增加願望地點</button>
            </div>
        </div>

        <!-- ================= DOCK NAVIGATION (下方的 Deck) ================= -->
        <nav class="fixed bottom-6 left-6 right-6 glass-effect rounded-[2.5rem] border border-white/50 shadow-2xl flex justify-around items-center p-2 px-4 z-50">
            <button @click="setTab('itinerary')" :class="currentTab === 'itinerary' ? 'tab-active' : 'text-slate-300'" class="flex flex-col items-center p-3 transition-all">
                <i data-lucide="calendar" class="w-6 h-6"></i>
                <span class="text-[10px] mt-1">行程</span>
            </button>
            <button @click="setTab('finance')" :class="currentTab === 'finance' ? 'tab-active' : 'text-slate-300'" class="flex flex-col items-center p-3 transition-all">
                <i data-lucide="banknote" class="w-6 h-6"></i>
                <span class="text-[10px] mt-1">記帳</span>
            </button>
            <button @click="setTab('wishlist')" :class="currentTab === 'wishlist' ? 'tab-active' : 'text-slate-300'" class="flex flex-col items-center p-3 transition-all">
                <i data-lucide="stars" class="w-6 h-6"></i>
                <span class="text-[10px] mt-1">心願</span>
            </button>
        </nav>

    </div>

    <script>
        const { createApp, ref, onMounted, computed, nextTick } = Vue;

        createApp({
            setup() {
                const currentTab = ref('itinerary');
                const selectedDay = ref(1);
                const exchangeRate = ref(0.052); // 最新日元轉港幣匯率參考
                
                // 行程日期設定
                const startDate = ref('2026-06-01');
                const endDate = ref('2026-06-05');

                const totalDays = computed(() => {
                    const start = new Date(startDate.value);
                    const end = new Date(endDate.value);
                    const diffDays = Math.ceil(Math.abs(end - start) / (1000 * 60 * 60 * 24)) + 1; 
                    return diffDays > 0 ? diffDays : 1;
                });

                // 天氣相關 (使用你的新 API Key)
                const weather = ref(null);
                const loadingWeather = ref(true);
                const apiKey = '78781fcf8811b4ce945f224a81386c53';

                const fetchWeather = async () => {
                    loadingWeather.value = true;
                    try {
                        const currentRes = await fetch(`https://api.openweathermap.org/data/2.5/weather?q=Okinawa&units=metric&appid=${apiKey}&lang=zh_tw`);
                        const currentData = await currentRes.json();
                        
                        const forecastRes = await fetch(`https://api.openweathermap.org/data/2.5/forecast?q=Okinawa&units=metric&appid=${apiKey}`);
                        const forecastData = await forecastRes.json();

                        weather.value = {
                            temp: currentData.main.temp,
                            rain: (forecastData.list[0].pop * 100) || 0,
                        };
                    } catch (e) {
                        weather.value = { temp: 28, rain: 10 }; // 錯誤時顯示模擬氣溫
                    } finally {
                        loadingWeather.value = false;
                        nextTick(() => lucide.createIcons());
                    }
                };

                // 數據儲存
                const itineraries = ref([
                    { day: 1, time: '14:00', location: '那霸機場' },
                    { day: 1, time: '16:00', location: '國際通' }
                ]);
                const expenses = ref([
                    { name: '午餐拉麵', amount: 1200 },
                    { name: '藥妝購物', amount: 5000 }
                ]);
                const spots = ref([{ name: '美麗海水族館' }, { name: '古宇利大橋' }]);

                const filteredItineraries = computed(() => 
                    itineraries.value.filter(i => i.day === selectedDay.value)
                    .sort((a, b) => a.time.localeCompare(b.time))
                );

                const totalExpensesHKD = computed(() => {
                    const totalJPY = expenses.value.reduce((sum, item) => sum + (item.amount || 0), 0);
                    return (totalJPY * exchangeRate.value).toLocaleString(undefined, {minimumFractionDigits: 1});
                });

                const setTab = (tab) => {
                    currentTab.value = tab;
                    nextTick(() => lucide.createIcons());
                };

                const addPlan = () => {
                    itineraries.value.push({ day: selectedDay.value, time: '12:00', location: '' });
                    nextTick(() => lucide.createIcons());
                };

                const removePlan = (idx) => {
                    const target = filteredItineraries.value[idx];
                    const realIdx = itineraries.value.indexOf(target);
                    itineraries.value.splice(realIdx, 1);
                };

                const addExpense = () => {
                    expenses.unshift({ name: '', amount: 0 });
                    nextTick(() => lucide.createIcons());
                };

                const openSingleMap = (loc) => {
                    if(!loc) return;
                    window.open(`https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(loc + ' 沖繩')}`, '_blank');
                };

                onMounted(() => {
                    lucide.createIcons();
                    fetchWeather();
                });

                return {
                    currentTab, selectedDay, itineraries, filteredItineraries,
                    expenses, totalExpensesHKD, spots, 
                    setTab, addPlan, addExpense, removePlan, openSingleMap, 
                    exchangeRate, weather, loadingWeather, startDate, endDate, totalDays
                };
            }
        }).mount('#app');
    </script>
</body>
</html>
