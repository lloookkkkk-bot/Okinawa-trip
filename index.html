<!-- ==================== 分頁 3: 心願 (Wishlist) ==================== -->
<div v-if="activeTab === 'wishlist'" class="px-5 animate-fadeIn">
    
    <!-- 頂部橫型切換選單 -->
    <div class="flex bg-white/50 p-1.5 rounded-2xl mb-6 border border-white">
        <button @click="wishlistSubTab = 'items'" 
                class="flex-1 py-3 rounded-xl text-xs font-bold transition-all"
                :class="wishlistSubTab === 'items' ? 'bg-[#B5495B] text-white shadow-md' : 'text-gray-400'">
            🛍️ 想要的東西
        </button>
        <button @click="wishlistSubTab = 'places'" 
                class="flex-1 py-3 rounded-xl text-xs font-bold transition-all"
                :class="wishlistSubTab === 'places' ? 'bg-[#B5495B] text-white shadow-md' : 'text-gray-400'">
            📍 想去的地點
        </button>
    </div>

    <!-- 1. 想要的東西內容 -->
    <div v-if="wishlistSubTab === 'items'" class="space-y-3">
        <button @click="showAddWishModal = true" class="w-full py-4 bg-white/60 rounded-2xl border-2 border-dashed border-gray-300 text-gray-500 text-sm font-bold flex items-center justify-center gap-2 mb-4">
            <i data-lucide="plus" class="w-4 h-4"></i> 新增購物清單
        </button>

        <div v-for="(item, index) in wishlistItems" :key="index" 
             class="bg-white/80 rounded-2xl p-4 flex justify-between items-center shadow-sm border border-white transition-all"
             :class="{ 'opacity-60': item.checked }">
            <div class="flex items-center gap-3">
                <!-- 自定義 Tick Box -->
                <div @click="item.checked = !item.checked" 
                     class="w-6 h-6 rounded-lg border-2 flex items-center justify-center transition-all cursor-pointer"
                     :class="item.checked ? 'bg-[#DB4D6D] border-[#DB4D6D]' : 'border-gray-200 bg-white'">
                    <i v-if="item.checked" data-lucide="check" class="w-4 h-4 text-white"></i>
                </div>
                <input v-model="item.text" class="bg-transparent border-none outline-none font-bold text-gray-700 text-sm w-40" :class="{ 'line-through text-gray-400': item.checked }">
            </div>
            <button @click="removeWishItem(index)" class="text-gray-300 hover:text-red-400"><i data-lucide="trash-2" class="w-4 h-4"></i></button>
        </div>
    </div>

    <!-- 2. 想去的地點內容 -->
    <div v-else class="space-y-4">
        <button @click="showAddPlaceModal = true" class="w-full py-4 bg-white/60 rounded-2xl border-2 border-dashed border-gray-300 text-gray-500 text-sm font-bold flex items-center justify-center gap-2 mb-4">
            <i data-lucide="map-pin" class="w-4 h-4"></i> 加入新景點
        </button>

        <div v-for="(place, index) in wishlistPlaces" :key="index" 
             class="glass-card p-5 flex justify-between items-center group relative overflow-hidden active:scale-95 transition-transform"
             @click="openGuide(place.name)">
            <div class="flex items-center gap-4">
                <div class="w-12 h-12 bg-[#FEDFE1] rounded-2xl flex items-center justify-center text-xl shadow-inner">🏝️</div>
                <div>
                    <h4 class="font-black text-gray-800">{{ place.name }}</h4>
                    <p class="text-[10px] text-pink-500 font-bold flex items-center gap-1">
                        <i data-lucide="sparkles" class="w-3 h-3"></i> 查看旅遊攻略
                    </p>
                </div>
            </div>
            <div class="flex items-center gap-2" @click.stop>
                <button @click="openNav(place.name)" class="p-2 bg-blue-50 text-blue-500 rounded-full shadow-sm"><i data-lucide="navigation" class="w-4 h-4"></i></button>
                <button @click="removePlace(index)" class="p-2 bg-red-50 text-red-400 rounded-full shadow-sm"><i data-lucide="x" class="w-4 h-4"></i></button>
            </div>
        </div>
    </div>

    <!-- 小導遊彈窗 (旅遊攻略) -->
    <div v-if="selectedGuide" class="fixed inset-0 bg-black/70 z-[200] backdrop-blur-md flex items-center justify-center p-6" @click="selectedGuide = null">
        <div class="bg-white w-full max-h-[80vh] rounded-[40px] overflow-hidden shadow-2xl animate-slide-up" @click.stop>
            <div class="relative h-32 flex items-center justify-center text-white" style="background: linear-gradient(135deg, var(--accent-color), var(--title-color));">
                <h2 class="text-2xl font-black tracking-widest">旅遊攻略</h2>
                <button @click="selectedGuide = null" class="absolute top-6 right-6 opacity-60"><i data-lucide="x"></i></button>
            </div>
            <div class="p-8 overflow-y-auto max-h-[calc(80vh-128px)] hide-scrollbar">
                <h3 class="text-center text-xl font-bold text-gray-800 mb-6 underline decoration-[#DB4D6D] decoration-4">📍 {{ selectedGuide.name }}</h3>
                
                <div class="space-y-6">
                    <section>
                        <h4 class="flex items-center gap-2 font-black text-[#DB4D6D] mb-2"><i data-lucide="info" class="w-4 h-4"></i> 景點介紹</h4>
                        <p class="text-sm text-gray-600 leading-relaxed bg-pink-50/50 p-4 rounded-2xl">{{ selectedGuide.intro }}</p>
                    </section>
                    
                    <div class="grid grid-cols-2 gap-4">
                        <section class="bg-orange-50/50 p-4 rounded-3xl">
                            <h4 class="flex items-center gap-2 font-bold text-orange-600 text-sm mb-2">🍱 必吃美食</h4>
                            <p class="text-[11px] text-gray-600">{{ selectedGuide.food }}</p>
                        </section>
                        <section class="bg-purple-50/50 p-4 rounded-3xl">
                            <h4 class="flex items-center gap-2 font-bold text-purple-600 text-sm mb-2">🎁 必買伴手</h4>
                            <p class="text-[11px] text-gray-600">{{ selectedGuide.souvenir }}</p>
                        </section>
                    </div>

                    <section>
                        <h4 class="flex items-center gap-2 font-black text-blue-500 mb-2"><i data-lucide="camera" class="w-4 h-4"></i> 必到影點 (打卡位)</h4>
                        <p class="text-sm text-gray-600 bg-blue-50/30 p-4 rounded-2xl">{{ selectedGuide.photoSpot }}</p>
                    </section>
                </div>
            </div>
        </div>
    </div>
</div>
