<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Okinawa Zen Travel</title>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Noto Sans JP', sans-serif; background-color: #f7fafc; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .day-card-active { background-color: #14b8a6; color: white; transform: scale(1.05); }
        .glass-effect { background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(8px); }
    </style>
</head>
<body class="text-slate-700">
    <div id="app" class="max-w-md mx-auto min-h-screen relative pb-32">
        
        <!-- Header -->
        <header class="p-6 pt-12 bg-white">
            <input v-model="tripName" class="text-2xl font-light tracking-widest text-teal-800 bg-transparent outline-none border-b border-teal-100 w-full mb-4">
            
            <!-- 橫向滑動日期選單 -->
            <div class="flex gap-4 overflow-x-auto no-scrollbar py-2">
                <div v-for="n in 7" :key="n" 
                     @click="selectedDay = n"
                     :class="selectedDay === n ? 'day-card-active shadow-lg' : 'bg-teal-50 text-teal-600'"
                     class="flex-shrink-0 w-16 h-20 rounded-2xl flex flex-col items-center justify-center transition-all duration-300 cursor-pointer">
                    <span class="text-[10px] opacity-70">DAY</span>
                    <span class="text-xl font-bold">{{ n }}</span>
                </div>
            </div>
        </header>

        <!-- 匯率與記帳統計 (日系卡片樣式) -->
        <section class="px-6 mb-6">
            <div class="bg-teal-600 rounded-3xl p-5 text-white shadow-xl shadow-teal-100">
                <div class="flex justify-between items-center mb-4">
                    <p class="text-sm font-light opacity-80">總支出概覽 (HKD)</p>
                    <i data-lucide="wallet" class="w-5 h-5 opacity-80"></i>
                </div>
                <h3 class="text-3xl font-bold mb-4 font-mono">$ {{ totalExpensesHKD }}</h3>
                
                <div class="grid grid-cols-2 gap-3 pt-4 border-t border-teal-400/50">
                    <div>
                        <p class="text-[10px] opacity-70 mb-1">今日支出 (JPY)</p>
                        <p class="font-medium">¥ {{ currentDayExpensesJPY }}</p>
                    </div>
                    <div>
                        <p class="text-[10px] opacity-70 mb-1">即時匯率</p>
                        <p class="font-medium text-xs">1 JPY ≈ {{ exchangeRate }} HKD</p>
                    </div>
                </div>
            </div>
        </section>

        <!-- 行程列表 -->
        <main class="px-6">
            <div class="flex justify-between items-center mb-6">
                <h2 class="text-sm font-bold tracking-widest text-teal-900 flex items-center gap-2">
                    <span class="w-1.5 h-1.5 bg-teal-500 rounded-full"></span>
                    DAY {{ selectedDay }} 行程安排
                </h2>
                <button @click="addPlan" class="text-teal-600 bg-teal-50 px-4 py-1.5 rounded-full text-xs font-medium active:scale-95 transition">
                    + 新增地點
                </button>
            </div>

            <div v-for="(item, index) in filteredItineraries" :key="index" class="mb-6 relative">
                <div class="bg-white rounded-[2rem] p-5 shadow-sm border border-teal-50/50 relative overflow-hidden">
                    <!-- 卡片內部天氣資訊 -->
                    <div class="absolute top-4 right-5 text-right">
                        <p class="text-[10px] text-slate-400">Local Weather</p>
                        <p class="text-xs font-bold text-teal-500">{{ item.temp }}°C ☀️</p>
                    </div>

                    <div class="flex items-center gap-3 mb-4">
                        <span class="w-2 h-2 bg-teal-200 rounded-full"></span>
                        <input type="time" v-model="item.time" class="text-sm font-mono text-teal-600 outline-none">
                    </div>

                    <input v-model="item.location" placeholder="輸入目的地" 
                           class="text-lg font-medium text-slate-800 w-full outline-none mb-4 placeholder:text-slate-200">
                    
                    <!-- 記帳輸入區 -->
                    <div class="flex items-center gap-2 bg-slate-50 p-3 rounded-2xl mb-4">
                        <span class="text-xs text-slate-400">¥</span>
                        <input type="number" v-model.number="item.costJPY" placeholder="輸入日幣金額" 
                               class="bg-transparent text-sm w-full outline-none font-mono">
                        <span class="text-[10px] text-slate-300">≈ ${{ (item.costJPY * exchangeRate).toFixed(1) }} HKD</span>
                    </div>

                    <div class="flex gap-2">
                        <button @click="openSingleMap(item.location)" class="flex-1 py-3 bg-teal-50 text-teal-600 rounded-2xl text-[10px] font-bold tracking-widest uppercase flex items-center justify-center gap-2">
                            <i data-lucide="map-pin" class="w-3 h-3"></i> Open Maps
                        </button>
                        <button @click="removePlan(index)" class="p-3 text-slate-300">
                            <i data-lucide="x" class="w-4 h-4"></i>
                        </button>
                    </div>
                </div>
            </div>
        </main>

        <!-- 導航欄 -->
        <nav class="fixed bottom-6 left-6 right-6 glass-effect rounded-[2.5rem] border border-white shadow-2xl flex justify-around p-4">
            <button @click="openMultiMap" class="flex items-center gap-3 bg-teal-600 text-white px-8 py-3 rounded-full shadow-lg active:scale-95 transition">
                <i data-lucide="navigation" class="w-5 h-5"></i>
                <span class="text-sm font-bold tracking-widest">全行程導航</span>
            </button>
        </nav>
    </div>

    <script>
        const { createApp, ref, onMounted, computed } = Vue;

        createApp({
            setup() {
                const tripName = ref('沖繩 · 琉璃色之夏');
                const selectedDay = ref(1);
                const exchangeRate = ref(0.052); // 模擬日幣兌港幣匯率
                
                // 行程資料結構升級：加入 day 和 costJPY
                const itineraries = ref([
                    { day: 1, time: '10:00', location: '那霸機場', costJPY: 0, temp: 27 },
                    { day: 1, time: '13:00', location: '瀨長島 Umikaji Terrace', costJPY: 2500, temp: 29 },
                    { day: 2, time: '11:00', location: '美麗海水族館', costJPY: 2180, temp: 28 }
                ]);

                const filteredItineraries = computed(() => {
                    return itineraries.value.filter(i => i.day === selectedDay.value);
                });

                // 記帳計算邏輯
                const currentDayExpensesJPY = computed(() => {
                    return filteredItineraries.value.reduce((sum, item) => sum + (item.costJPY || 0), 0);
                });

                const totalExpensesHKD = computed(() => {
                    const totalJPY = itineraries.value.reduce((sum, item) => sum + (item.costJPY || 0), 0);
                    return (totalJPY * exchangeRate.value).toFixed(2);
                });

                const addPlan = () => {
                    itineraries.value.push({ 
                        day: selectedDay.value, 
                        time: '12:00', 
                        location: '', 
                        costJPY: 0,
                        temp: Math.floor(Math.random() * (31 - 26) + 26)
                    });
                    setTimeout(() => lucide.createIcons(), 0);
                };

                const removePlan = (index) => {
                    const realIndex = itineraries.value.indexOf(filteredItineraries.value[index]);
                    itineraries.value.splice(realIndex, 1);
                };

                const openSingleMap = (loc) => {
                    if (!loc) return alert('請輸入地點');
                    window.open(`https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(loc + ' 沖繩')}`, '_blank');
                };

                const openMultiMap = () => {
                    const locations = filteredItineraries.value.map(i => i.location).filter(l => l.length > 0);
                    if (locations.length === 0) return alert('今日無行程');
                    const dest = encodeURIComponent(locations[locations.length - 1]);
                    const waypoints = locations.slice(0, -1).map(l => encodeURIComponent(l)).join('|');
                    window.open(`https://www.google.com/maps/dir/?api=1&origin=My+Location&destination=${dest}&waypoints=${waypoints}&travelmode=driving`, '_blank');
                };

                onMounted(() => lucide.createIcons());

                return {
                    tripName, selectedDay, exchangeRate, itineraries, filteredItineraries,
                    currentDayExpensesJPY, totalExpensesHKD,
                    addPlan, removePlan, openSingleMap, openMultiMap
                };
            }
        }).mount('#app');
    </script>
</body>
</html>
