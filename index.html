<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>沖繩之旅 🌴</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700&display=swap');
        body { font-family: 'Noto Sans TC', sans-serif; background-color: #FFF5F7; color: #5A5A5A; }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        .capsule-title {
            background-color: #FF708A;
            border-radius: 999px;
            padding: 8px 24px;
            box-shadow: 0 4px 15px rgba(255, 112, 138, 0.3);
            cursor: pointer;
        }

        .date-sub-capsule {
            background-color: white;
            border-radius: 999px;
            padding: 4px 16px;
            font-size: 12px;
            color: #FF708A;
            font-weight: bold;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
            margin-top: 8px;
            cursor: pointer;
        }

        .date-pill.active { background-color: #FF708A; color: white; }
        
        /* 編輯輸入框樣式 */
        .edit-input {
            background: transparent;
            border: none;
            text-align: center;
            color: inherit;
            font-weight: inherit;
            width: auto;
            outline: none;
            border-bottom: 1px dashed rgba(255,255,255,0.5);
        }
        .date-sub-capsule .edit-input { border-bottom-color: #FF708A; }

        .animate-slide-up { animation: slide-up 0.3s ease-out; }
        @keyframes slide-up { from { transform: translateY(100%); } to { transform: translateY(0); } }
    </style>
</head>
<body>

<div id="app" class="max-w-md mx-auto min-h-screen pb-28 relative overflow-x-hidden">
    
    <!-- 可編輯 Header -->
    <header class="flex flex-col items-center py-6">
        <div class="capsule-title text-white font-bold text-xl flex items-center gap-2">
            <span v-if="!isEditingTitle" @click="isEditingTitle = true">{{ tripTitle }}</span>
            <input v-else v-model="tripTitle" @blur="isEditingTitle = false" @keyup.enter="isEditingTitle = false" class="edit-input" autofocus>
            <span>🌴</span>
        </div>
        
        <div class="date-sub-capsule flex items-center gap-1">
            <template v-if="!isEditingDate">
                <span @click="isEditingDate = true">{{ dateRange }} ‧ 共 {{ totalDays }} 天</span>
            </template>
            <template v-else>
                <input v-model="dateRange" class="edit-input w-32" placeholder="日期範圍">
                <input v-model.number="totalDays" type="number" class="edit-input w-8" @blur="isEditingDate = false">
            </template>
        </div>
    </header>

    <main class="px-4">
        <div v-if="activeTab === 'itinerary'">
            <!-- 橫向滑動日期選單 -->
            <div class="flex overflow-x-auto gap-3 py-4 hide-scrollbar snap-x">
                <div v-for="n in totalDays" :key="n"
                     @click="selectedDayIndex = n-1"
                     class="date-pill flex-shrink-0 w-16 h-20 rounded-2xl bg-white shadow-sm flex flex-col items-center justify-center transition-all cursor-pointer snap-start"
                     :class="{ 'active': selectedDayIndex === n-1 }">
                    <span class="text-xs opacity-70">Day</span>
                    <span class="text-xl font-bold">{{ n }}</span>
                </div>
            </div>

            <!-- 天氣資訊 -->
            <div class="bg-white/60 rounded-3xl p-4 mb-6 flex items-center justify-between shadow-sm border border-white">
                <div class="flex items-center gap-3">
                    <img :src="`https://openweathermap.org/img/wn/${weather.icon}@2x.png`" class="w-12 h-12">
                    <div>
                        <p class="text-sm text-gray-500">今日沖繩</p>
                        <p class="font-bold text-gray-700">{{ weather.temp }}°C - {{ weather.description }}</p>
                    </div>
                </div>
            </div>

            <!-- 行程清單 -->
            <div class="space-y-4">
                <div v-for="(item, idx) in currentItinerary" :key="idx" 
                     class="bg-white rounded-3xl p-5 shadow-sm border border-pink-50 relative group">
                    
                    <div class="flex gap-4 items-start">
                        <div class="flex flex-col items-center">
                            <span class="text-sm font-bold text-pink-500">{{ item.time }}</span>
                            <div class="w-0.5 h-16 bg-pink-50 my-1"></div>
                        </div>
                        
                        <div class="flex-grow">
                            <h3 class="font-bold text-gray-800 text-lg">{{ item.location }}</h3>
                            
                            <!-- 備註編輯區 -->
                            <div class="mt-2">
                                <textarea v-model="item.note" 
                                          class="w-full text-xs text-gray-400 bg-gray-50 p-2 rounded-xl border-none focus:ring-1 focus:ring-pink-200 outline-none resize-none" 
                                          placeholder="加入備註..."></textarea>
                            </div>

                            <div class="flex gap-2 mt-3">
                                <button @click="openNav(item.location)" class="text-[10px] bg-blue-50 text-blue-500 px-3 py-1.5 rounded-full flex items-center gap-1">
                                    <i data-lucide="map-pin" class="w-3 h-3"></i> 導航
                                </button>
                                <button @click="removeItem(idx)" class="text-[10px] bg-red-50 text-red-400 px-3 py-1.5 rounded-full">
                                    刪除
                                </button>
                            </div>
                        </div>
                    </div>
                </div>

                <button @click="showAddModal = true" class="w-full py-4 rounded-3xl border-2 border-dashed border-pink-200 text-pink-300 font-medium flex justify-center items-center gap-2 hover:bg-pink-50">
                    <i data-lucide="plus-circle"></i> 新增行程
                </button>
            </div>
        </div>

        <!-- 空白分頁 -->
        <div v-else class="flex flex-col items-center mt-20 text-gray-300">
            <i data-lucide="sparkles" class="w-12 h-12 mb-2 animate-pulse"></i>
            <p>即將解鎖此功能 ✨</p>
        </div>
    </main>

    <!-- 新增行程彈窗 -->
    <div v-if="showAddModal" class="fixed inset-0 bg-black/40 flex items-end z-[50]">
        <div class="bg-white w-full rounded-t-[40px] p-8 animate-slide-up shadow-2xl">
            <div class="flex justify-between items-center mb-6">
                <h2 class="text-xl font-bold text-gray-700">準備去哪裡？</h2>
                <button @click="showAddModal = false" class="text-gray-300"><i data-lucide="x"></i></button>
            </div>
            <div class="space-y-4">
                <div class="flex gap-4">
                    <div class="flex-1">
                        <label class="text-xs text-gray-400 ml-2">時間</label>
                        <input v-model="newItem.time" type="time" class="w-full p-4 bg-gray-50 rounded-2xl outline-none mt-1">
                    </div>
                    <div class="flex-[2]">
                        <label class="text-xs text-gray-400 ml-2">地點</label>
                        <input v-model="newItem.location" type="text" class="w-full p-4 bg-gray-50 rounded-2xl outline-none mt-1" placeholder="目的地">
                    </div>
                </div>
                <div>
                    <label class="text-xs text-gray-400 ml-2">備註</label>
                    <textarea v-model="newItem.note" class="w-full p-4 bg-gray-50 rounded-2xl outline-none mt-1" placeholder="寫點什麼..." rows="2"></textarea>
                </div>
                <button @click="addItem" class="w-full py-4 bg-pink-500 text-white rounded-2xl font-bold shadow-lg shadow-pink-100">新增到 Day {{ selectedDayIndex + 1 }}</button>
            </div>
        </div>
    </div>

    <!-- 底部選單 -->
    <nav class="fixed bottom-6 left-1/2 -translate-x-1/2 w-[90%] max-w-md bg-white/90 backdrop-blur-md h-16 rounded-full shadow-2xl flex items-center justify-around px-6 z-40">
        <button v-for="tab in tabs" :key="tab.id" @click="activeTab = tab.id"
                class="flex flex-col items-center gap-1 transition-all"
                :class="activeTab === tab.id ? 'text-pink-500 scale-110' : 'text-gray-300'">
            <i :data-lucide="tab.icon" class="w-6 h-6"></i>
            <span class="text-[10px] font-bold">{{ tab.name }}</span>
        </button>
    </nav>
</div>

<script>
    const { createApp, ref, computed, onMounted, watch } = Vue;

    createApp({
        setup() {
            // 狀態控制
            const tripTitle = ref('沖繩之旅');
            const dateRange = ref('06/15 - 06/19');
            const totalDays = ref(5);
            const isEditingTitle = ref(false);
            const isEditingDate = ref(false);
            
            const activeTab = ref('itinerary');
            const selectedDayIndex = ref(0);
            const showAddModal = ref(false);
            const weather = ref({ temp: '--', description: '載入中', icon: '01d' });
            
            // 行程數據管理 (預設空數組)
            const itineraryData = ref({});

            const currentItinerary = computed(() => {
                if (!itineraryData.value[selectedDayIndex.value]) {
                    itineraryData.value[selectedDayIndex.value] = [];
                }
                return itineraryData.value[selectedDayIndex.value];
            });

            const newItem = ref({ time: '09:00', location: '', note: '' });

            const tabs = [
                { id: 'itinerary', name: '行程', icon: 'map' },
                { id: 'billing', name: '記賬', icon: 'wallet' },
                { id: 'wishlist', name: '心願', icon: 'heart' }
            ];

            const fetchWeather = async () => {
                try {
                    const res = await fetch(`https://api.openweathermap.org/data/2.5/weather?q=Naha,jp&units=metric&lang=zh_tw&appid=bd5e378503939ddaee76f12ad7a97608`);
                    const data = await res.json();
                    weather.value = { temp: Math.round(data.main.temp), description: data.weather[0].description, icon: data.weather[0].icon };
                } catch(e) {}
            };

            const addItem = () => {
                if (!newItem.value.location) return;
                const day = selectedDayIndex.value;
                if (!itineraryData.value[day]) itineraryData.value[day] = [];
                
                itineraryData.value[day].push({ ...newItem.value });
                itineraryData.value[day].sort((a, b) => a.time.localeCompare(b.time));
                
                showAddModal.value = false;
                newItem.value = { time: '09:00', location: '', note: '' };
                setTimeout(() => lucide.createIcons(), 10);
            };

            const removeItem = (idx) => {
                itineraryData.value[selectedDayIndex.value].splice(idx, 1);
            };

            const openNav = (loc) => window.open(`https://www.google.com/maps/dir/?api=1&destination=${encodeURIComponent(loc + ' 沖繩')}`);

            onMounted(() => {
                lucide.createIcons();
                fetchWeather();
            });

            return {
                tripTitle, dateRange, totalDays, isEditingTitle, isEditingDate,
                activeTab, tabs, selectedDayIndex, currentItinerary,
                showAddModal, newItem, addItem, removeItem, openNav, weather
            };
        }
    }).mount('#app');
</script>
</body>
</html>
