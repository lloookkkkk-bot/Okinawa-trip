<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>沖繩之旅 🌴</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Kosugi+Maru&family=Noto+Sans+TC:wght@400;700&display=swap');
        body { font-family: 'Kosugi+Maru', 'Noto+Sans+TC', sans-serif; background-color: #FFF5F7; -webkit-tap-highlight-color: transparent; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        .glass-card { background: rgba(255, 255, 255, 0.8); backdrop-filter: blur(10px); border: 1px solid rgba(255, 182, 193, 0.3); }
        /* 優化日曆輸入框外觀 */
        input[type="date"]::-webkit-calendar-picker-indicator { cursor: pointer; opacity: 0.5; transition: 0.3s; }
        input[type="date"]::-webkit-calendar-picker-indicator:hover { opacity: 1; transform: scale(1.1); }
    </style>
</head>
<body class="max-w-md mx-auto min-h-screen shadow-lg bg-white">

<div id="app" class="pb-32 bg-[#FFF5F7] min-h-screen">
    <header class="pt-10 pb-6 px-6 text-center">
        <div class="inline-flex items-center px-6 py-2 bg-[#FF5588] rounded-full text-white shadow-lg mb-4">
            <input v-model="tripTitle" class="bg-transparent text-center font-bold text-xl focus:outline-none border-none w-40">
            <i class="fas fa-pen text-xs ml-2 opacity-70"></i>
        </div>

        <div class="flex justify-center">
            <div class="inline-flex items-center px-5 py-2 bg-white rounded-full text-[#FF5588] text-sm shadow-md border border-pink-100">
                <div class="flex items-center">
                    <input type="date" v-model="startDate" @change="handleDateChange" class="bg-transparent focus:outline-none font-bold">
                    <span class="mx-2 text-pink-300">➔</span>
                    <input type="date" v-model="endDate" @change="handleDateChange" class="bg-transparent focus:outline-none font-bold">
                </div>
                <div class="ml-3 bg-pink-100 px-3 py-1 rounded-full font-bold text-xs">
                    {{ totalDays }} 天
                </div>
            </div>
        </div>
    </header>

    <nav class="flex overflow-x-auto no-scrollbar px-6 py-2 gap-3 mb-6">
        <button 
            v-for="day in totalDays" 
            :key="day"
            @click="currentDay = day"
            :class="currentDay === day ? 'bg-[#FF5588] text-white scale-110 shadow-lg' : 'bg-white text-pink-400'"
            class="flex-shrink-0 w-20 py-4 rounded-2xl shadow-sm transition-all duration-300 font-bold"
        >
            Day {{ day }}
        </button>
    </nav>

    <main class="px-6">
        <div v-if="activeTab === '行程'">
            <div class="flex justify-between items-center mb-6">
                <h2 class="text-xl font-bold text-gray-700">第 {{ currentDay }} 天行程</h2>
                <button @click="addItinerary" class="bg-[#FF5588] text-white px-4 py-2 rounded-full shadow-md text-sm font-bold active:scale-95">
                    <i class="fas fa-plus mr-1"></i> 新增地點
                </button>
            </div>

            <div class="space-y-5">
                <div v-for="(item, index) in filteredItinerary" :key="index" class="glass-card p-5 rounded-3xl shadow-sm border-l-8 border-l-[#FF5588]">
                    <div class="flex justify-between items-start mb-3">
                        <div class="flex flex-col gap-2 w-full">
                            <div class="flex items-center gap-2">
                                <input type="time" v-model="item.time" class="bg-transparent font-black text-[#FF5588] text-lg focus:outline-none">
                                <input v-model="item.location" placeholder="要去哪裡呢？" class="bg-transparent font-bold text-gray-800 text-lg focus:outline-none w-full">
                            </div>
                            <div class="flex items-center gap-2 text-xs text-sky-500 font-bold">
                                <i class="fas fa-temperature-high"></i>
                                <span>沖繩：{{ weatherInfo.temp }}°C ({{ weatherInfo.desc }})</span>
                            </div>
                        </div>
                        <div class="flex gap-2">
                            <button @click="openNavigation(item.location)" class="text-emerald-500 bg-emerald-50 w-8 h-8 rounded-full flex items-center justify-center">
                                <i class="fas fa-location-arrow"></i>
                            </button>
                            <button @click="removeItem(item)" class="text-pink-200 hover:text-pink-500">
                                <i class="fas fa-trash-alt"></i>
                            </button>
                        </div>
                    </div>

                    <div class="mt-3 bg-pink-50/50 rounded-2xl p-3 border border-pink-100">
                        <div class="flex items-center gap-2 mb-1">
                            <i class="fas fa-sticky-note text-[10px] text-pink-400"></i>
                            <span class="text-[10px] text-pink-400 font-bold uppercase tracking-widest">Memo / 備註</span>
                        </div>
                        <textarea v-model="item.note" rows="2" placeholder="記下好吃的、要買的..." class="w-full bg-transparent text-sm text-gray-600 focus:outline-none resize-none"></textarea>
                    </div>
                </div>
                
                <div v-if="filteredItinerary.length === 0" class="text-center py-10 text-pink-300">
                    <i class="fas fa-umbrella-beach text-4xl mb-2 opacity-30"></i>
                    <p>今天還沒有行程喔！</p>
                </div>
            </div>
        </div>

        <div v-else class="text-center py-20 text-pink-200 font-bold italic">
            {{ activeTab }} 功能正在飛奔而來...
        </div>
    </main>

    <nav class="fixed bottom-6 left-1/2 -translate-x-1/2 w-[90%] max-w-md bg-white/90 backdrop-blur-md h-20 rounded-full shadow-2xl flex justify-around items-center border border-pink-100 px-6 z-50">
        <button v-for="tab in ['行程', '記賬', '心願']" 
                @click="activeTab = tab"
                :class="activeTab === tab ? 'text-[#FF5588] scale-110' : 'text-gray-300'"
                class="flex flex-col items-center transition-all">
            <i :class="getTabIcon(tab)" class="text-2xl"></i>
            <span class="text-[10px] mt-1 font-black">{{ tab }}</span>
        </button>
    </nav>
</div>
<script>
    const { createApp, ref, computed, onMounted } = Vue;

    createApp({
        setup() {
            // 基礎設定
            const tripTitle = ref('沖繩之旅 🌴');
            const startDate = ref('2024-07-01');
            const endDate = ref('2024-07-05');
            const activeTab = ref('行程');
            const currentDay = ref(1);
            
            // 天氣資料
            const weatherInfo = ref({ temp: '28', desc: '晴天' });

            // 所有行程 (以陣列存放)
            const itineraries = ref([
                { id: 1, day: 1, time: '10:00', location: '那霸機場', note: '領取 OTS 租車' },
                { id: 2, day: 1, time: '12:30', location: '國際通', note: '吃石垣牛' }
            ]);

            // 計算總天數
            const totalDays = computed(() => {
                const start = new Date(startDate.value);
                const end = new Date(endDate.value);
                if (isNaN(start) || isNaN(end)) return 1;
                const diffTime = end - start;
                const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24)) + 1;
                return diffDays > 0 ? diffDays : 1;
            });

            // 處理日期變更 (當天數縮短時，確保 currentDay 不會越界)
            const handleDateChange = () => {
                if (currentDay.value > totalDays.value) {
                    currentDay.value = totalDays.value;
                }
            };

            // 過濾出目前選定天數的行程
            const filteredItinerary = computed(() => {
                return itineraries.value
                    .filter(item => item.day === currentDay.value)
                    .sort((a, b) => a.time.localeCompare(b.time));
            });

            // 新增行程
            const addItinerary = () => {
                itineraries.value.push({
                    id: Date.now(),
                    day: currentDay.value,
                    time: '09:00',
                    location: '',
                    note: ''
                });
            };

            // 刪除行程
            const removeItem = (target) => {
                itineraries.value = itineraries.value.filter(item => item.id !== target.id);
            };

            // 導航跳轉 Google Map
            const openNavigation = (location) => {
                if (!location) {
                    alert('請先輸入地點名稱喔！');
                    return;
                }
                const url = `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(location)}`;
                window.open(url, '_blank');
            };

            const getTabIcon = (tab) => {
                const icons = { '行程': 'fas fa-map-signs', '記賬': 'fas fa-coins', '心願': 'fas fa-star' };
                return icons[tab];
            };

            onMounted(() => {
                // 這裡可以加入真實 Fetch 天氣 API 的邏輯
                console.log('App Ready!');
            });

            return {
                tripTitle, startDate, endDate, totalDays, 
                activeTab, currentDay, filteredItinerary,
                addItinerary, removeItem, getTabIcon,
                weatherInfo, openNavigation, handleDateChange
            };
        }
    }).mount('#app');
</script>
</body>
</html>
